<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIS - Live Vision Protocol V6.0</title>
  <style>
    :root {
      --bg-color: #05070d;
      --card-bg: #0b101d;
      --cyan-glow: #00f0ff;
      --pink-glow: #ff007f;
      --green-glow: #00ff88;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-color);
      border-left: 2px solid var(--cyan-glow);
      border-right: 2px solid var(--pink-glow);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
      position: relative;
    }

    /* Top Pill Header */
    .header-pill {
      border: 1.5px solid var(--pink-glow);
      border-radius: 50px;
      padding: 8px 24px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    /* Hexagon Logo */
    .logo-container {
      margin-top: 10px;
      width: 65px;
      height: 75px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: var(--cyan-glow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-inner {
      width: 59px;
      height: 69px;
      background: var(--card-bg);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: var(--cyan-glow);
    }

    /* Titles */
    .title-group {
      text-align: center;
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Mandate Card */
    .mandate-card {
      width: 100%;
      background: #150918;
      border-left: 4px solid var(--pink-glow);
      padding: 14px 16px;
      border-radius: 4px;
    }

    .mandate-title {
      color: var(--pink-glow);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mandate-text {
      color: #d1d5db;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 4px;
      border: 1px solid #1a2336;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--cyan-glow);
    }

    /* Buttons */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      cursor: pointer;
      border: none;
      clip-path: polygon(0 0, 96% 0, 100% 35%, 100% 100%, 4% 100%, 0 65%);
      transition: all 0.2s ease;
    }

    .btn-white {
      background: #ffffff;
      color: #05070d;
    }

    .btn-green {
      background: #042416;
      color: var(--green-glow);
      border: 1px solid var(--green-glow);
    }

    .btn-cyan {
      background: #042030;
      color: var(--cyan-glow);
      border: 1px solid var(--cyan-glow);
    }

    /* STK Deposit Cyberpunk Modal */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 13, 0.95);
      z-index: 100;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--green-glow);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green-glow);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }

    .form-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .form-input {
      background: #05070d;
      border: 1px solid #1a2336;
      color: #ffffff;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--green-glow);
    }

    .status-msg {
      font-size: 0.75rem;
      margin-top: 10px;
      color: var(--cyan-glow);
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-pill">🎮 HAVE FUN & PLAY FAIR ⚡</div>

    <div class="logo-container">
      <div class="logo-inner">A</div>
    </div>

    <div class="title-group">
      <h1 class="main-title">AETHERIS</h1>
      <p class="subtitle">LIVE VISION PROTOCOL V6.0</p>
    </div>

    <div class="mandate-card">
      <div class="mandate-title">⚠️ FAIR PLAY MANDATE</div>
      <p class="mandate-text">
        Real-time vision telemetry actively flags modded APKs, speed hacks, and cheat overlays. Zero-tolerance auto-forfeiture enabled.
      </p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">ARBITRATION</div>
        <div class="stat-value">Live Gemini 2.5</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ANTI-CHEAT</div>
        <div class="stat-value">Active Vision</div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-white" onclick="alert('Match initialization queue active.')">INITIALIZE MATCH</button>
      <button class="btn btn-green" onclick="openModal()">DEPOSIT STAKE</button>
      <button class="btn btn-cyan" onclick="alert('Connecting to AI Referee Terminal...')">LIVE AI REFEREE TERMINAL</button>
    </div>

    <!-- Cyberpunk STK Push Modal Overlay -->
    <div class="modal-overlay" id="stkModal">
      <div class="modal-content">
        <div class="modal-title">M-PESA ESCROW STAKE</div>
        
        <div class="form-group">
          <label class="form-label">SAFARICOM PHONE NUMBER</label>
          <input type="text" id="phoneInput" class="form-input" placeholder="2547XXXXXXXX" value="2547">
        </div>

        <div class="form-group">
          <label class="form-label">MATCH STAKE AMOUNT (KES)</label>
          <input type="number" id="amountInput" class="form-input" value="10" readonly>
        </div>

        <button class="btn btn-green" style="margin-top: 10px;" onclick="submitDeposit()">SEND STK PUSH</button>
        <button class="btn btn-cyan" style="margin-top: 8px; background: transparent; border-color: #334155;" onclick="closeModal()">CANCEL</button>

        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('stkModal').style.display = 'flex';
      document.getElementById('statusMsg').innerText = '';
    }

    function closeModal() {
      document.getElementById('stkModal').style.display = 'none';
    }

    async function submitDeposit() {
      const phone = document.getElementById('phoneInput').value.trim();
      const amount = document.getElementById('amountInput').value;
      const status = document.getElementById('statusMsg');

      if (!phone || phone.length < 12) {
        status.style.color = '#ff007f';
        status.innerText = 'Invalid format. Use 2547XXXXXXXX';
        return;
      }

      status.style.color = '#00f0ff';
      status.innerText = 'Dispatching STK Push prompt...';

      const matchId = "MATCH_" + Math.floor(1000 + Math.random() * 9000);

      try {
        const res = await fetch(`/api/v1/deposit?phone_number=${encodeURIComponent(phone)}&match_id=${matchId}&amount=${amount}`, {
          method: 'POST'
        });
        const data = await res.json();

        if (res.ok) {
          status.style.color = '#00ff88';
          status.innerText = 'STK Push sent! Enter M-Pesa PIN on your mobile device.';
          setTimeout(closeModal, 4000);
        } else {
          status.style.color = '#ff007f';
          status.innerText = data.detail || 'STK Push Failed.';
        }
      } catch (err) {
        status.style.color = '#ff007f';
        status.innerText = 'Server error. Check API connection.';
      }
    }
  </script>
</body>
</html>
