<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIS - Live Vision Protocol V6.0</title>
  <style>
    :root {
      --bg-color: #05070d;
      --card-bg: #0b101d;
      --cyan-glow: #00f0ff;
      --pink-glow: #ff007f;
      --green-glow: #00ff88;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-color);
      border-left: 2px solid var(--cyan-glow);
      border-right: 2px solid var(--pink-glow);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
    }

    /* Top Pill Header */
    .header-pill {
      border: 1.5px solid var(--pink-glow);
      border-radius: 50px;
      padding: 8px 24px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(ff, 0, 127, 0.3);
    }

    /* Hexagon Logo */
    .logo-container {
      margin-top: 10px;
      width: 65px;
      height: 75px;
      background: transparent;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      border: 2px solid var(--cyan-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-inner {
      width: 59px;
      height: 69px;
      background: var(--card-bg);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: var(--cyan-glow);
    }

    /* Titles */
    .title-group {
      text-align: center;
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Fair Play Mandate Card */
    .mandate-card {
      width: 100%;
      background: #150918;
      border-left: 4px solid var(--pink-glow);
      padding: 14px 16px;
      border-radius: 4px;
    }

    .mandate-title {
      color: var(--pink-glow);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mandate-text {
      color: #d1d5db;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 4px;
      border: 1px solid #1a2336;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--cyan-glow);
    }

    /* Buttons */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      cursor: pointer;
      border: none;
      clip-path: polygon(0 0, 96% 0, 100% 35%, 100% 100%, 4% 100%, 0 65%);
      transition: all 0.2s ease;
    }

    .btn-white {
      background: #ffffff;
      color: #05070d;
    }

    .btn-green {
      background: #042416;
      color: var(--green-glow);
      border: 1px solid var(--green-glow);
    }

    .btn-cyan {
      background: #042030;
      color: var(--cyan-glow);
      border: 1px solid var(--cyan-glow);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-pill">
      🎮 HAVE FUN & PLAY FAIR ⚡
    </div>

    <div class="logo-container">
      <div class="logo-inner">A</div>
    </div>

    <div class="title-group">
      <h1 class="main-title">AETHERIS</h1>
      <p class="subtitle">LIVE VISION PROTOCOL V6.0</p>
    </div>

    <div class="mandate-card">
      <div class="mandate-title">
        ⚠️ FAIR PLAY MANDATE
      </div>
      <p class="mandate-text">
        Real-time vision telemetry actively flags modded APKs, speed hacks, and cheat overlays. Zero-tolerance auto-forfeiture enabled.
      </p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">ARBITRATION</div>
        <div class="stat-value">Live Gemini 2.5</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ANTI-CHEAT</div>
        <div class="stat-value">Active Vision</div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-white" onclick="alert('Match initialization queue active.')">INITIALIZE MATCH</button>
      <button class="btn btn-green" onclick="handleDeposit()">DEPOSIT STAKE</button>
      <button class="btn btn-cyan" onclick="alert('Connecting to AI Referee Telemetry...')">LIVE AI REFEREE TERMINAL</button>
    </div>
  </div>

  <script>
    async function handleDeposit() {
      const phone = prompt("Enter your M-Pesa phone number (Format: 2547XXXXXXXX):");
      if (!phone) return;

      const matchId = "MATCH_" + Math.floor(1000 + Math.random() * 9000);
      
      try {
        const response = await fetch(`/api/v1/deposit?phone_number=${encodeURIComponent(phone)}&match_id=${matchId}`, {
          method: 'POST'
        });
        const data = await response.json();
        
        if (response.ok) {
          alert(`STK Push sent to ${phone}. Please enter your M-Pesa PIN on your phone to lock the 10 KES stake.`);
        } else {
          alert(`Error: ${data.detail || 'Failed to trigger STK Push'}`);
        }
      } catch (err) {
        alert("Failed to connect to payment backend.");
      }
    }
  </script>
</body>
</html>
