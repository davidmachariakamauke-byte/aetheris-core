<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIS | AI Referee & Live Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0E14; color: #E2E8F0; font-family: 'Inter', sans-serif; }
        .neon-border { border: 1px solid #38BDF8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="w-full max-w-6xl flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold tracking-wider text-sky-400">AETHERIS <span class="text-white text-lg">v8.0</span></h1>
        <div class="text-sm bg-gray-800 px-4 py-2 rounded-full border border-gray-700">
            Player ID: <span id="player-id-display" class="font-mono text-sky-300">AETH-001</span>
        </div>
    </div>

    <!-- Main Engine Grid -->
    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-6 h-[75vh]">
        
        <!-- Left: Telemetry & Screen Capture -->
        <div class="md:col-span-2 bg-gray-900 rounded-xl p-4 neon-border flex flex-col relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Live Screen Telemetry</h2>
                <span id="ai-status" class="text-red-500 font-bold animate-pulse">AI OFFLINE</span>
            </div>
            
            <!-- Video Element for Screen Capture -->
            <video id="screen-preview" class="w-full h-full bg-black rounded-lg object-contain border border-gray-800" autoplay muted></video>
            
            <button id="start-match-btn" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-sky-500 hover:bg-sky-400 text-black font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(56,189,248,0.8)] transition-all">
                START MATCH & INITIATE AI REFEREE
            </button>
        </div>

        <!-- Right: AI Chat & Announcements -->
        <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 flex flex-col">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">AI Referee Chat</h2>
            
            <div id="chat-box" class="chat-container flex-1 overflow-y-auto mb-4 space-y-3 pr-2">
                <div class="text-gray-400 text-sm italic">AETHERIS AI: Waiting for match telemetry to begin...</div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Talk to the AI Referee..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 focus:outline-none focus:border-sky-500 text-sm">
                <button id="send-chat-btn" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-lg font-bold transition">Send</button>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-match-btn');
        const videoElem = document.getElementById('screen-preview');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-chat-btn');
        const aiStatus = document.getElementById('ai-status');
        
        let ws;
        let mediaStream;
        const inGameId = "player_" + Math.floor(Math.random() * 1000); 

        // Append messages to UI
        function appendMessage(sender, text, isAnnouncement = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-2 rounded-lg text-sm ${sender === 'AI' ? (isAnnouncement ? 'bg-sky-900 border border-sky-400 text-white font-bold text-center' : 'bg-gray-800 text-sky-300') : 'bg-gray-700 text-white self-end'}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Start Match & WebSocket
        startBtn.addEventListener('click', async () => {
            try {
                // Request Screen Share
                mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                videoElem.srcObject = mediaStream;
                startBtn.classList.add('hidden');
                
                aiStatus.textContent = "AI MONITORING ACTIVE";
                aiStatus.className = "text-green-400 font-bold animate-pulse";

                // Connect WebSocket to FastAPI Backend
                ws = new WebSocket(`ws://localhost:8000/ws/referee/${inGameId}`);

                ws.onopen = () => {
                    appendMessage('AI', 'Connection established. I am monitoring your screen for modifications. Play clean, play hard.');
                    
                    // Capture frames and send via WebSockets every 2 seconds for anti-cheat
                    setInterval(() => {
                        if (ws.readyState === WebSocket.OPEN) {
                            const canvas = document.createElement('canvas');
                            canvas.width = videoElem.videoWidth;
                            canvas.height = videoElem.videoHeight;
                            canvas.getContext('2d').drawImage(videoElem, 0, 0);
                            const frameData = canvas.toDataURL('image/jpeg', 0.5); // Compress to save bandwidth
                            
                            ws.send(JSON.stringify({ type: 'telemetry_frame', data: frameData }));
                        }
                    }, 2000);
                };

                ws.onmessage = (event) => {
                    const response = JSON.parse(event.data);
                    if (response.type === 'chat') {
                        appendMessage('AI', response.message);
                    } else if (response.type === 'announcement') {
                        appendMessage('AI', response.message, true);
                        if(response.action === 'trigger_payout') {
                            appendMessage('SYSTEM', 'Initiating M-PESA Daraja payout sequence...');
                        }
                    }
                };

            } catch (err) {
                console.error("Error starting match:", err);
                alert("You must share your screen to allow the AI Referee to monitor the match.");
            }
        });

        // Send Chat to AI
        sendBtn.addEventListener('click', () => {
            const text = chatInput.value;
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                appendMessage('You', text);
                ws.send(JSON.stringify({ type: 'player_chat', text: text }));
                chatInput.value = '';
            }
        });
    </script>
</body>
</html>
