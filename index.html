<script>
        // --- 1. CONFIGURATION & STATE ---
        // Pointing directly to your active Render backend
        const API_BASE_URL = "https://aetheris-backend-s3hu.onrender.com";
        const WS_URL = "wss://aetheris-backend-s3hu.onrender.com/ws/referee";
        
        let ws;
        const chatBox = document.getElementById('chat-box');
        const telemetryLog = document.getElementById('telemetry-log');

        // --- 2. WEBSOCKET CONNECTION (The AI Engine) ---
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.querySelector('.ping-dot').style.background = '#00ff66';
                document.querySelector('.ping-dot').style.boxShadow = '0 0 10px #00ff66';
                addChatMessage('ai', "WSS Uplink established. I am your AI Referee. Submit your In-Game ID and fund the escrow to begin.");
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.event === "AI_RESPONSE" || data.event === "AI_ALERT") {
                    addChatMessage('ai', data.message, data.type);
                } 
                else if (data.event === "PAYMENT_SECURED") {
                    telemetryLog.innerHTML = `
                        > Payment Verified via Daraja.<br>
                        > Player ${data.in_game_id} authenticated.<br>
                        > [AI VISION] Screen stream connected.<br>
                        <span style="color:var(--cyan)">> MATCH STARTED.</span>
                    `;
                    addChatMessage('ai', data.message, "win");
                }
            };

            ws.onclose = () => {
                document.querySelector('.ping-dot').style.background = 'red';
                document.querySelector('.ping-dot').style.boxShadow = '0 0 10px red';
                addChatMessage('ai', "[SYSTEM] Connection lost. Attempting to reconnect...", "alert");
                setTimeout(connectWebSocket, 5000); // Auto-reconnect if Render spins down
            };
        }

        // --- 3. UI FUNCTIONS ---
        function addChatMessage(sender, text, type = '') {
            const msg = document.createElement('div');
            msg.className = `chat-msg ${sender === 'ai' ? 'msg-ai' : 'msg-user'} ${type}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat_input');
            const text = input.value.trim();
            
            if(!text) return;
            
            addChatMessage('user', text);
            input.value = '';

            // Send to FastAPI over WebSocket
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
            } else {
                addChatMessage('ai', "[ERROR] Neural link disconnected. Message failed to send.", "alert");
            }
        }

        // Allow Enter key to send chat messages
        document.getElementById('chat_input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendChatMessage();
        });

        // --- 4. API TRIGGERS (Daraja Integration) ---
        async function triggerEscrow() {
            const inGameId = document.getElementById('in_game_id').value.trim();
            const amount = document.getElementById('stake_amount').value.trim();
            const phone = document.getElementById('mpesa_number').value.trim();

            if(!inGameId || !amount || !phone) {
                addChatMessage('ai', "[ERROR] Missing Escrow Parameters. Check ID, Amount, and Phone Number.", "alert");
                return;
            }

            addChatMessage('ai', `Escrow STK Push initiated to ${phone} for KES ${amount}. Awaiting Daraja confirmation...`);

            try {
                const response = await fetch(`${API_BASE_URL}/api/escrow/stk-push`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        in_game_id: inGameId,
                        stake_amount: parseFloat(amount),
                        mpesa_number: phone
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    addChatMessage('ai', result.message);
                    // The WebSocket will handle the success message once the background task finishes
                } else {
                    addChatMessage('ai', `[API ERROR] ${result.detail || "Failed to trigger Daraja."}`, "alert");
                }
            } catch (error) {
                console.error("STK Push Error:", error);
                addChatMessage('ai', "[SYSTEM ERROR] Could not reach the backend server.", "alert");
            }
        }

        // Boot up the connection on load
        window.onload = connectWebSocket;
    </script>
