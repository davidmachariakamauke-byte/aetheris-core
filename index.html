<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIS V9.0 | Autonomous AI Referee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { bg: '#020408', cyan: '#00F0FF', neon: '#39FF14', alert: '#FF0055' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
        
        body {
            background-color: #020408;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #E2E8F0;
            font-family: 'Rajdhani', sans-serif;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        .neon-box {
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00F0FF; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(800%); }
        }
        .scan-effect { animation: scanline 6s linear infinite; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden p-3 md:p-5 select-none">

    <!-- TOP HUD BAR -->
    <header class="w-full max-w-7xl mx-auto flex flex-wrap justify-between items-center pb-3 border-b border-slate-800/80">
        <div class="flex items-center gap-4">
            <div class="relative flex items-center justify-center">
                <div class="h-4 w-4 rounded-full bg-cyan-400 animate-ping absolute"></div>
                <div class="h-3 w-3 rounded-full bg-cyan-300"></div>
            </div>
            <div>
                <h1 class="font-orbitron text-2xl md:text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    AETHERIS <span class="text-xs px-2 py-0.5 bg-cyan-950 text-cyan-400 rounded border border-cyan-800 font-mono">V9.0</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-3 text-xs font-mono">
            <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                <span class="text-slate-500">PAYOUT RAILS:</span>
                <span class="text-emerald-400 font-bold">M-PESA DARAJA LIVE</span>
            </div>
            <div id="connection-status-badge" class="bg-red-950/80 border border-red-800 text-red-400 px-3 py-1.5 rounded-lg font-bold flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-red-500"></span>
                <span>WS OFFLINE</span>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-5 my-auto h-[78vh]">
        
        <!-- LEFT: AI TELEMETRY -->
        <section class="lg:col-span-2 bg-slate-950/90 backdrop-blur-xl rounded-2xl p-4 neon-box flex flex-col justify-between relative">
            <div class="flex justify-between items-center mb-2 z-10">
                <div class="flex items-center gap-3">
                    <span class="font-orbitron text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-2">
                        <span class="h-2 w-2 rounded-full bg-cyan-400"></span> Anti-Cheat Vision
                    </span>
                </div>
                <div id="ai-verdict-tag" class="text-xs font-mono font-bold text-amber-400 bg-amber-950/60 px-3 py-1 rounded-md border border-amber-800/80">
                    IDLE
                </div>
            </div>

            <!-- Viewport -->
            <div class="relative w-full flex-1 bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                <video id="screen-preview" class="w-full h-full object-contain" autoplay muted></video>
                <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cyan-500/10 to-transparent h-20 w-full scan-effect pointer-events-none"></div>

                <div id="launch-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center gap-5 z-20">
                    <button id="start-match-btn" class="font-orbitron bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black tracking-widest py-4 px-10 rounded-xl shadow-[0_0_30px_rgba(0,240,255,0.4)] transition-all transform hover:scale-105">
                        INITIALIZE TELEMETRY
                    </button>
                </div>
            </div>
        </section>

        <!-- RIGHT: CONSOLE -->
        <section class="bg-slate-950/90 backdrop-blur-xl rounded-2xl p-4 border border-slate-800 flex flex-col justify-between">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <h2 class="font-orbitron text-xs font-bold uppercase text-slate-200">Neural Console</h2>
                <span id="player-id-display" class="text-[10px] font-mono text-purple-400">INIT...</span>
            </div>

            <div id="chat-box" class="custom-scrollbar flex-1 overflow-y-auto my-3 space-y-3 pr-1 text-xs">
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-400">
                    <span class="text-cyan-400 font-bold block mb-1 font-orbitron">SYSTEM STANDBY</span>
                    Awaiting screen telemetry. Automated B2C escrow release is armed.
                </div>
            </div>

            <div class="py-2 border-t border-slate-800/80 flex gap-2 overflow-x-auto">
                <button onclick="sendQuickMacro('Verify Web3 Contract Status')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 text-[10px] font-mono px-2 py-1 rounded border border-slate-700 whitespace-nowrap">Check Web3</button>
                <button onclick="sendQuickMacro('/trigger_payout')" class="bg-emerald-950/80 hover:bg-emerald-900 text-emerald-400 text-[10px] font-mono px-2 py-1 rounded border border-emerald-800 whitespace-nowrap">Trigger M-PESA Escrow</button>
            </div>

            <form id="chat-form" class="flex gap-2 mt-1">
                <input type="text" id="chat-input" placeholder="Enter command..." autocomplete="off" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 rounded-xl text-xs font-orbitron">SEND</button>
            </form>
        </section>
    </main>

    <script>
        const RENDER_BACKEND_DOMAIN = "aetheris-backend-s3hu.onrender.com";
        const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        const WS_PROTOCOL = isLocal ? "ws://" : "wss://";
        const WS_HOST = isLocal ? "localhost:8000" : RENDER_BACKEND_DOMAIN;

        const startBtn = document.getElementById('start-match-btn');
        const launchOverlay = document.getElementById('launch-overlay');
        const videoElem = document.getElementById('screen-preview');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const connBadge = document.getElementById('connection-status-badge');
        const aiVerdictTag = document.getElementById('ai-verdict-tag');
        
        let ws, mediaStream, audioCtx;
        const inGameId = "AETH_" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('player-id-display').textContent = inGameId;

        function safePlaySFX(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'announcement') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function logMessage(sender, text, type = 'chat') {
            const wrapper = document.createElement('div');
            if (type === 'announcement') {
                safePlaySFX('announcement');
                wrapper.className = "p-3 rounded-xl bg-slate-900 border border-emerald-500 text-emerald-300 text-center font-bold shadow-[0_0_15px_rgba(16,185,129,0.2)] my-2 font-orbitron";
                wrapper.innerHTML = `💸 <span class="uppercase">${sender}:</span> ${text}`;
            } else if (type === 'system') {
                wrapper.className = "p-2 text-[11px] text-slate-500 italic";
                wrapper.innerHTML = `<strong class="text-amber-500 not-italic">${sender}:</strong> ${text}`;
            } else {
                const isAI = sender === 'AI REFEREE';
                wrapper.className = `p-2.5 rounded-xl border ${isAI ? 'bg-slate-900 border-cyan-900 text-cyan-300' : 'bg-slate-800 border-slate-700 text-slate-200 ml-4'}`;
                wrapper.innerHTML = `<span class="font-bold ${isAI ? 'text-cyan-400 font-orbitron' : 'text-purple-400'} block mb-1">${sender}</span>${text}`;
            }
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connectWebSocket() {
            ws = new WebSocket(`${WS_PROTOCOL}${WS_HOST}/ws/referee/${inGameId}`);

            ws.onopen = () => {
                connBadge.className = "bg-emerald-950/80 border border-emerald-800 text-emerald-400 px-3 py-1.5 rounded-lg font-bold flex items-center gap-2";
                connBadge.innerHTML = `<span class="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span><span>WS ONLINE</span>`;
                logMessage('SYSTEM', 'Encrypted tunnel established to aetheris-backend-s3hu.onrender.com.', 'system');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'chat') {
                        logMessage('AI REFEREE', data.message);
                    } else if (data.type === 'announcement') {
                        logMessage('SETTLEMENT', data.message, 'announcement');
                    }
                } catch (e) { console.error(e); }
            };

            ws.onclose = () => {
                connBadge.className = "bg-red-950/80 border border-red-800 text-red-400 px-3 py-1.5 rounded-lg font-bold flex items-center gap-2";
                connBadge.innerHTML = `<span class="h-2 w-2 rounded-full bg-red-500"></span><span>WS OFFLINE</span>`;
                setTimeout(connectWebSocket, 3000);
            };
        }

        startBtn.addEventListener('click', async () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { max: 15 } } });
                videoElem.srcObject = mediaStream;
                launchOverlay.classList.add('hidden');

                aiVerdictTag.textContent = "AI VISION ACTIVE";
                aiVerdictTag.className = "text-xs font-mono font-bold text-cyan-400 bg-cyan-950/80 px-3 py-1 rounded border border-cyan-700 animate-pulse";

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN && videoElem.videoWidth > 0) {
                        canvas.width = 640; canvas.height = 360;
                        ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
                        ws.send(JSON.stringify({ type: 'telemetry_frame', data: canvas.toDataURL('image/jpeg', 0.3) }));
                    }
                }, 2000);

                mediaStream.getVideoTracks()[0].onended = () => {
                    launchOverlay.classList.remove('hidden');
                    aiVerdictTag.textContent = "STREAM DROPPED";
                    aiVerdictTag.className = "text-xs font-mono font-bold text-red-400 bg-red-950/80 px-3 py-1 rounded border border-red-800";
                };

            } catch (err) {
                alert("Screen share is required to activate the AI Referee.");
            }
        });

        function sendQuickMacro(msg) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (ws && ws.readyState === WebSocket.OPEN) {
                logMessage('YOU', msg);
                ws.send(JSON.stringify({ type: 'player_chat', text: msg }));
            }
        }

        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = chatInput.value.trim();
            if (msg) {
                sendQuickMacro(msg);
                chatInput.value = '';
            }
        });

        connectWebSocket();
    </script>
</body>
</html>
