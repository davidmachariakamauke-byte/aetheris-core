<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETHERIS - Omniversal Escrow V8.0</title>
  <style>
    :root {
      --bg-color: #05070d;
      --card-bg: #0b101d;
      --cyan-glow: #00f0ff;
      --pink-glow: #ff007f;
      --green-glow: #00ff88;
      --red-alert: #ff1e1e;
      --text-muted: #8a99ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-color); color: #ffffff;
      display: flex; justify-content: center;
      min-height: 100vh; padding: 2vh 15px; overflow-x: hidden;
    }

    .app-container {
      width: 100%; max-width: 440px; background: var(--bg-color);
      border-left: 2px solid var(--cyan-glow); border-right: 2px solid var(--pink-glow);
      padding: clamp(15px, 4vw, 25px); display: flex; flex-direction: column;
      align-items: center; gap: clamp(12px, 3vw, 18px);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.15); border-radius: 8px;
    }

    /* Animated Pulsing Logo */
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px var(--cyan-glow); border-color: var(--cyan-glow); }
      50% { box-shadow: 0 0 30px var(--cyan-glow), 0 0 10px #fff; border-color: #fff; }
      100% { box-shadow: 0 0 10px var(--cyan-glow); border-color: var(--cyan-glow); }
    }
    .logo-container {
      width: 65px; height: 75px; background: var(--cyan-glow);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center; animation: pulseGlow 3s infinite alternate;
    }
    .logo-inner {
      width: 59px; height: 69px; background: var(--card-bg);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 900; color: var(--cyan-glow); text-shadow: 0 0 10px var(--cyan-glow);
    }

    .title-group { text-align: center; width: 100%; }
    .main-title { font-size: clamp(1.8rem, 6vw, 2.2rem); font-weight: 900; letter-spacing: 4px; }
    .subtitle { font-size: clamp(0.65rem, 3vw, 0.75rem); color: var(--green-glow); letter-spacing: 3px; font-weight: 600; }

    /* Modals with Blur */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 7, 13, 0.9); backdrop-filter: blur(8px);
      z-index: 100; padding: 20px; flex-direction: column; justify-content: center; align-items: center;
    }
    .modal-content {
      width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--green-glow);
      border-radius: 8px; padding: clamp(15px, 5vw, 25px); box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
      max-height: 90vh; overflow-y: auto;
    }

    .modal-title { font-size: clamp(0.9rem, 4vw, 1.1rem); font-weight: 800; color: var(--green-glow); margin-bottom: 12px; }
    .form-input { 
      background: #05070d; border: 1px solid #1a2336; color: #ffffff; 
      padding: 12px; border-radius: 4px; width: 100%; outline: none; margin-bottom: 15px; font-size: 16px; 
    }
    .form-input:focus { border-color: var(--green-glow); }

    /* Buttons */
    .btn {
      width: 100%; padding: 16px 10px; font-size: clamp(0.75rem, 3.5vw, 0.9rem); font-weight: 800; letter-spacing: 1px;
      cursor: pointer; border: none; clip-path: polygon(0 0, 96% 0, 100% 35%, 100% 100%, 4% 100%, 0 65%);
      transition: all 0.2s ease; margin-bottom: 10px; text-transform: uppercase;
    }
    .btn:active { transform: scale(0.98); }
    .btn-white { background: #ffffff; color: #05070d; }
    .btn-green { background: #042416; color: var(--green-glow); border: 1px solid var(--green-glow); }
    .btn-pink { background: #2a0514; color: var(--pink-glow); border: 1px solid var(--pink-glow); }
    .btn-cyan { background: #042030; color: var(--cyan-glow); border: 1px solid var(--cyan-glow); }

    /* CRT Terminal Console */
    .terminal-container {
      width: 100%; height: 350px; background: #000; border: 2px solid var(--cyan-glow);
      border-radius: 4px; padding: 10px; display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .terminal-output {
      flex-grow: 1; overflow-y: auto; color: var(--green-glow); font-family: monospace;
      font-size: 0.8rem; line-height: 1.4; margin-bottom: 10px; word-wrap: break-word;
    }
    .terminal-input-row { display: flex; align-items: center; gap: 5px; }
    .terminal-input {
      background: transparent; border: none; color: #fff; font-family: monospace;
      font-size: 0.8rem; flex-grow: 1; outline: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="logo-container"><div class="logo-inner">A</div></div>
    
    <div class="title-group">
      <h1 class="main-title">AETHERIS</h1>
      <p class="subtitle">MULTI-PLAYER ESCROW PROTOCOL V8.0</p>
    </div>

    <!-- Main Buttons -->
    <button class="btn btn-white" onclick="openInitModal()">1. HOST NEW MATCH</button>
    <button class="btn btn-green" onclick="openDepositModal()">2. BIND & STAKE STK</button>
    <button class="btn btn-pink" onclick="alert('File upload prompt: Upload Victory Screenshot for AI Analysis.')">3. SUBMIT VICTORY PROOF</button>
    <button class="btn btn-cyan" onclick="openTerminal()">LIVE AI REFEREE</button>

    <!-- Init Modal -->
    <div class="modal-overlay" id="initModal">
      <div class="modal-content" style="border-color: var(--cyan-glow);">
        <div class="modal-title" style="color: var(--cyan-glow);">LOBBY GENERATED</div>
        <p style="font-size: 0.8rem; color: #8a99ad; margin-bottom: 10px;">Share this link. Works for 2-player PES or 20-player Ludo/Militia.</p>
        <div style="background: #05070d; padding: 12px; border: 1px dashed var(--cyan-glow); color: var(--cyan-glow); font-family: monospace; word-break: break-all; margin-bottom: 15px; text-align: center;" id="matchLinkText">https://aetheris.onrender.com/join/MATCH_8800</div>
        <button class="btn btn-cyan" onclick="closeModal('initModal')">CLOSE</button>
      </div>
    </div>

    <!-- Stake & Bind Modal -->
    <div class="modal-overlay" id="depositModal">
      <div class="modal-content">
        <div class="modal-title">BIND IDENTITY & STAKE</div>
        
        <label style="font-size: 0.75rem; color: var(--text-muted);">IN-GAME USERNAME (e.g. SnipeZz)</label>
        <input type="text" id="gameIdInput" class="form-input" placeholder="Enter Exact Username">

        <label style="font-size: 0.75rem; color: var(--text-muted);">SAFARICOM PHONE NUMBER</label>
        <input type="text" id="phoneInput" class="form-input" placeholder="2547XXXXXXXX" value="2547">
        
        <label style="font-size: 0.75rem; color: var(--text-muted);">POOL STAKE (KES)</label>
        <input type="number" id="amountInput" class="form-input" value="10" readonly>
        
        <button class="btn btn-green" onclick="submitDeposit()">SEND STK PUSH</button>
        <button class="btn btn-white" style="background: transparent; color: #fff; border: 1px solid #334155;" onclick="closeModal('depositModal')">CANCEL</button>
        <div id="statusMsg" style="font-size: 0.75rem; margin-top: 10px; color: var(--cyan-glow); text-align: center;"></div>
      </div>
    </div>

    <!-- AI Terminal -->
    <div class="modal-overlay" id="terminalModal" style="background: rgba(0,0,0,0.95);">
      <div class="terminal-container" style="max-width: 100%; border: none;">
        <div class="terminal-output" id="termOutput">
          <span style="color: var(--cyan-glow);">SYS: OMNIVERSAL ARBITRATION ONLINE.</span><br>
          Awaiting vision telemetry...<br><br>
        </div>
        <div class="terminal-input-row">
          <span style="color: var(--cyan-glow); font-family: monospace;">SYS:~$</span>
          <input type="text" id="termInput" class="terminal-input" autocomplete="off" onkeypress="handleTerminalEnter(event)">
        </div>
      </div>
      <button class="btn btn-cyan" style="margin-top: 15px;" onclick="closeModal('terminalModal')">EXIT</button>
    </div>
  </div>

  <script>
    let currentMatchId = "MATCH_8800";

    function openInitModal() { document.getElementById('initModal').style.display = 'flex'; }
    function openDepositModal() { document.getElementById('depositModal').style.display = 'flex'; }
    function openTerminal() { document.getElementById('terminalModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function submitDeposit() {
      const phone = document.getElementById('phoneInput').value.trim();
      const gameId = document.getElementById('gameIdInput').value.trim();
      const amount = document.getElementById('amountInput').value;
      const status = document.getElementById('statusMsg');

      if (!gameId) { status.style.color = '#ff1e1e'; status.innerText = 'Game Username required.'; return; }
      if (!phone || phone.length < 12) { status.style.color = '#ff1e1e'; status.innerText = 'Invalid Phone.'; return; }
      
      status.style.color = '#00f0ff'; status.innerText = `Binding ${gameId} and sending STK Push...`;

      try {
        const res = await fetch(`/api/v1/deposit?phone_number=${encodeURIComponent(phone)}&match_id=${currentMatchId}&amount=${amount}&in_game_id=${encodeURIComponent(gameId)}`, { method: 'POST' });
        if (res.ok) {
          status.style.color = '#00ff88'; status.innerText = 'STK Sent! Waiting for PIN...';
        } else {
          status.style.color = '#ff1e1e'; status.innerText = 'STK Push Failed.';
        }
      } catch (err) { status.style.color = '#ff1e1e'; status.innerText = 'API Connection Error.'; }
    }

    async function handleTerminalEnter(e) {
      if (e.key === 'Enter') {
        const inputField = document.getElementById('termInput');
        const query = inputField.value.trim();
        if(!query) return;
        
        const output = document.getElementById('termOutput');
        output.innerHTML += `<div><span style="color: var(--cyan-glow);">SYS:~$</span> ${query}</div>`;
        inputField.value = '';
        output.scrollTop = output.scrollHeight;

        // Simulated AI Response
        setTimeout(() => {
          if(query.includes("win")) {
            output.innerHTML += `<div>> [AI VISION]: Match Screenshot Analyzed. Winner verified as 'SnipeZz'. Payout initiating to bound M-PESA...</div><br>`;
          } else {
            output.innerHTML += `<div>> [SYSTEM]: Query processed. Awaiting match completion.</div><br>`;
          }
          output.scrollTop = output.scrollHeight;
        }, 800);
      }
    }
  </script>
</body>
</html>
